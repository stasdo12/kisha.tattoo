name: Uptime

# Checks the live site from outside every 10 minutes and reports to the enquiries Telegram chat
# only when its state changes (🔴 down / 🟢 back). Once a day at 06:00 UTC (07:00 Munich in
# winter) it sends a short summary either way. See scripts/uptime.mjs.

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      daily:
        description: 'Send the daily summary now'
        type: boolean
        default: true

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The last result travels between runs in the Actions cache, so a long outage
      # sends one 🔴 and one 🟢 instead of a message every 10 minutes.
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check the site
        run: node scripts/uptime.mjs --state .uptime-state.json ${{ (github.event.schedule == '0 6 * * *' || inputs.daily) && '--daily' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}
